version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nkaurelien-website:latest
    container_name: nkaurelien-website
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000

  # Postgres + pgvector local (même version majeure que Neon : 18).
  # Au 1er démarrage : db/schema.sql puis db/migrations/*.sql ; ensuite `make db-seed`.
  db:
    image: pgvector/pgvector:pg18
    container_name: nkaurelien-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/init/02-migrations.sh:/docker-entrypoint-initdb.d/02-migrations.sh:ro
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
