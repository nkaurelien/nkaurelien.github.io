version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nkaurelien-website:latest
    container_name: nkaurelien-website
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
